services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: contractguard
      POSTGRES_USER: contractguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contractguard -d contractguard"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql+psycopg://contractguard:${POSTGRES_PASSWORD:-local-only-change-me}@db:5432/contractguard
      AUTH_MODE: demo
    ports:
      - "3000:3000"
    volumes:
      - app_uploads:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  app_uploads:
